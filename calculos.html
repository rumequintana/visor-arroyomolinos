<script>
/* Visor urbanístico de Arroyomolinos — pestaña «Cálculos»: secciones y perfiles, distancias, áreas, coordenadas y rutas */
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (x,d=2) => (x==null||!isFinite(x)) ? '—' : Number(x).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
const sg = (x,d=2) => (x==null||!isFinite(x)) ? '—' : (x>0?'+':'')+nf(x,d);
const AVISO = 'La información carece de valor legal y no reemplaza a un levantamiento topográfico.';
const NOTA_MDT = 'Terreno: MDT05 del IGN (CNIG), malla de 5 m con cotas enteras, suavizado para eliminar los escalones de 1 m. Vale para pendientes y desniveles generales; la cota decimétrica en un punto concreto es orientativa. Para un expediente que exija precisión, usar MDT02/LiDAR o levantamiento topográfico.';
const UTM = '+proj=utm +zone=30 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs';
const aU = ll => proj4('EPSG:4326', UTM, [ll.lng, ll.lat]);
const aLL = (x,y) => { const p = proj4(UTM, 'EPSG:4326', [x,y]); return L.latLng(p[1], p[0]); };
const hoy = () => new Date().toLocaleDateString('es-ES');

// ================================================================ datos
function b64(s){ const bin = atob(s); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function gunzip(u){ return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); }
let MDT=null, PARC=null, TERM=null;
async function cargarMDT(){ const M = window.__MDT; if (!M) return null;
  const u = await gunzip(b64(M.datos)); const dv = new DataView(u.buffer, u.byteOffset, u.byteLength);
  const z = new Float32Array(M.nx*M.ny);
  for (let r=0;r<M.ny;r++){ let acc=M.base; const o=r*M.nx; for (let c=0;c<M.nx;c++){ acc += dv.getInt16((o+c)*2, true); z[o+c] = acc/10; } }
  return Object.assign({}, M, {z, datos:null}); }
function bboxCoords(cs, b){ if (typeof cs[0]==='number'){ if(cs[0]<b[0])b[0]=cs[0]; if(cs[1]<b[1])b[1]=cs[1]; if(cs[0]>b[2])b[2]=cs[0]; if(cs[1]>b[3])b[3]=cs[1]; } else for (const c of cs) bboxCoords(c,b); return b; }
async function cargarParcelas(){ const D = window.__VISOR_DATA; if (!D||!D.parcelas) return null;
  const fc = JSON.parse(new TextDecoder().decode(await gunzip(b64(D.parcelas))));
  fc.features = fc.features.filter(f => f.geometry && f.geometry.coordinates && f.geometry.coordinates.length);
  fc.features.forEach((f,i) => { f.__bb = bboxCoords(f.geometry.coordinates,[1e9,1e9,-1e9,-1e9]); f.__k = f.properties.refcat || ('#'+(f.properties._i!=null?f.properties._i:i)); });
  return fc; }
async function cargarTermino(){ const D = window.__VISOR_DATA; if (!D||!D.capas) return null;
  try { const c = JSON.parse(new TextDecoder().decode(await gunzip(b64(D.capas)))); return c.termino || null; } catch(e){ return null; } }
function utmDe(f){ if (!f.__u){ const g=f.geometry; const polys = g.type==='Polygon' ? [g.coordinates] : g.coordinates;
    f.__u = polys.map(p => p.map(r => r.map(c => proj4('EPSG:4326', UTM, c))));
    f.__ub = bboxCoords(f.__u, [1e12,1e12,-1e12,-1e12]); } return f; }
function candidatas(bb, m=3){ if (!PARC) return [];
  const cs = [[bb[0]-m,bb[1]-m],[bb[2]+m,bb[1]-m],[bb[0]-m,bb[3]+m],[bb[2]+m,bb[3]+m]].map(c => proj4(UTM,'EPSG:4326',c));
  const lb = [Math.min(...cs.map(c=>c[0])), Math.min(...cs.map(c=>c[1])), Math.max(...cs.map(c=>c[0])), Math.max(...cs.map(c=>c[1]))];
  return PARC.features.filter(f => !(f.__bb[2]<lb[0]||f.__bb[0]>lb[2]||f.__bb[3]<lb[1]||f.__bb[1]>lb[3])).map(utmDe); }
function pipPolys(x,y,polys){ let ins=false; for (const p of polys) for (const r of p) for (let i=0,j=r.length-1;i<r.length;j=i++){
  const xi=r[i][0], yi=r[i][1], xj=r[j][0], yj=r[j][1]; if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function parcelaEn(x,y,cands){ for (const f of cands){ const b=f.__ub; if (x<b[0]||x>b[2]||y<b[1]||y>b[3]) continue; if (pipPolys(x,y,f.__u)) return f; } return null; }
function zAt(x,y){ const M=MDT; if (!M) return null; const c=(x-M.x0)/M.rx-0.5, r=(M.y0-y)/M.ry-0.5; const c0=Math.floor(c), r0=Math.floor(r);
  if (c0<0||r0<0||c0+1>=M.nx||r0+1>=M.ny) return null; const dc=c-c0, dr=r-r0, n=M.nx, z=M.z, i=r0*n+c0;
  return z[i]*(1-dc)*(1-dr) + z[i+1]*dc*(1-dr) + z[i+n]*(1-dc)*dr + z[i+n+1]*dc*dr; }
const fParc = k => PARC ? PARC.features.find(f => f.__k===k) : null;
const etiqParc = k => { const f=fParc(k); if(!f) return k||'—'; const p=f.properties; return (p.direccion?p.direccion+' · ':'')+(p.refcat||k); };

// ================================================================ geometría (UTM)
function acumulada(P){ const C=[0]; for (let i=1;i<P.length;i++) C.push(C[i-1]+Math.hypot(P[i][0]-P[i-1][0], P[i][1]-P[i-1][1])); return C; }
function interp(P,C,d){ if (d<=0) return P[0].slice(); const n=P.length-1; if (d>=C[n]) return P[n].slice();
  let lo=0, hi=n; while (hi-lo>1){ const m=(lo+hi)>>1; if (C[m]<=d) lo=m; else hi=m; }
  const s=C[hi]-C[lo]||1, t=(d-C[lo])/s; return [P[lo][0]+(P[hi][0]-P[lo][0])*t, P[lo][1]+(P[hi][1]-P[lo][1])*t]; }
function localizar(P,C,x,y){ let best=1e18, dd=0; for (let i=0;i<P.length-1;i++){ const ax=P[i][0], ay=P[i][1], bx=P[i+1][0]-ax, by=P[i+1][1]-ay; const l2=bx*bx+by*by||1;
  let t=((x-ax)*bx+(y-ay)*by)/l2; t=Math.max(0,Math.min(1,t)); const e=Math.hypot(ax+bx*t-x, ay+by*t-y); if (e<best){ best=e; dd=C[i]+t*Math.sqrt(l2); } } return dd; }
function cruce(p,q,r,s){ const d1x=q[0]-p[0], d1y=q[1]-p[1], d2x=s[0]-r[0], d2y=s[1]-r[1]; const den=d1x*d2y-d1y*d2x; if (Math.abs(den)<1e-12) return null;
  const t=((r[0]-p[0])*d2y-(r[1]-p[1])*d2x)/den, u=((r[0]-p[0])*d1y-(r[1]-p[1])*d1x)/den; return (t>=-1e-9&&t<=1+1e-9&&u>=-1e-9&&u<=1+1e-9) ? t : null; }
function cortesConPolys(P,C,polys){ const out=[]; for (let i=0;i<P.length-1;i++){ const sl=C[i+1]-C[i];
  const sb=[Math.min(P[i][0],P[i+1][0]),Math.min(P[i][1],P[i+1][1]),Math.max(P[i][0],P[i+1][0]),Math.max(P[i][1],P[i+1][1])];
  for (const pol of polys) for (const r of pol) for (let j=0;j<r.length-1;j++){ const a=r[j], b=r[j+1];
    if (Math.max(a[0],b[0])<sb[0]||Math.min(a[0],b[0])>sb[2]||Math.max(a[1],b[1])<sb[1]||Math.min(a[1],b[1])>sb[3]) continue;
    const t=cruce(P[i],P[i+1],a,b); if (t!=null) out.push(C[i]+t*sl); } } return out; }
const bboxU = P => bboxCoords(P,[1e12,1e12,-1e12,-1e12]);
function areaAnillo(r){ let a=0; for (let i=0,j=r.length-1;i<r.length;j=i++) a += (r[j][0]+r[i][0])*(r[j][1]-r[i][1]); return Math.abs(a)/2; }
function muestreo(polys, maxN=20000){ const bb=bboxCoords(polys,[1e12,1e12,-1e12,-1e12]); const A=(bb[2]-bb[0])*(bb[3]-bb[1]);
  const s=Math.max(1, Math.sqrt(A/maxN)); const X=[], Y=[], Z=[];
  for (let x=bb[0]+s/2; x<bb[2]; x+=s) for (let y=bb[1]+s/2; y<bb[3]; y+=s) if (pipPolys(x,y,polys)){ const z=zAt(x,y); if (z!=null){ X.push(x); Y.push(y); Z.push(z); } }
  return {X,Y,Z,paso:s}; }
function centroInterior(m){ if (!m.X.length) return null; const mx=m.X.reduce((a,b)=>a+b,0)/m.X.length, my=m.Y.reduce((a,b)=>a+b,0)/m.Y.length;
  let bi=0, bd=1e18; m.X.forEach((x,i)=>{ const d=Math.hypot(x-mx, m.Y[i]-my); if (d<bd){ bd=d; bi=i; } }); return [m.X[bi], m.Y[bi]]; }
function planoLSQ(X,Y,Z){ const n=X.length; if (n<3) return null; const mx=X.reduce((a,b)=>a+b,0)/n, my=Y.reduce((a,b)=>a+b,0)/n, mz=Z.reduce((a,b)=>a+b,0)/n;
  let sxx=0,syy=0,sxy=0,sxz=0,syz=0; for (let i=0;i<n;i++){ const x=X[i]-mx, y=Y[i]-my, z=Z[i]-mz; sxx+=x*x; syy+=y*y; sxy+=x*y; sxz+=x*z; syz+=y*z; }
  const det=sxx*syy-sxy*sxy; if (Math.abs(det)<1e-9) return null; const a=(sxz*syy-syz*sxy)/det, b=(syz*sxx-sxz*sxy)/det;
  let e=0; for (let i=0;i<n;i++){ const r=mz+a*(X[i]-mx)+b*(Y[i]-my)-Z[i]; e+=r*r; }
  return {a,b, z:(x,y)=>mz+a*(x-mx)+b*(y-my), pend:Math.hypot(a,b)*100, azi:((Math.atan2(-a,-b)*180/Math.PI)+360)%360, rmse:Math.sqrt(e/n)}; }
function rectaLSQ(D,Z){ const n=D.length; if (n<2) return null; const md=D.reduce((a,b)=>a+b,0)/n, mz=Z.reduce((a,b)=>a+b,0)/n; let sdd=0, sdz=0;
  for (let i=0;i<n;i++){ sdd+=(D[i]-md)**2; sdz+=(D[i]-md)*(Z[i]-mz); } const k=sdd? sdz/sdd : 0; return {k, f:d=>mz+k*(d-md)}; }
const rumbo = (dx,dy) => ((Math.atan2(dx,dy)*180/Math.PI)+360)%360;
const ROSA = a => ['N','NE','E','SE','S','SO','O','NO'][Math.round(a/45)%8];

// ================================================================ cálculo de la sección / perfil
function autoPaso(L){ return L<=150?0.5 : L<=600?1 : L<=2000?2 : L<=5000?5 : 10; }
function calcularPerfil(P, o){
  const C=acumulada(P), L=C[C.length-1]; if (L<1) throw new Error('La línea es demasiado corta.');
  const paso = o.paso==='auto' ? autoPaso(L) : +o.paso;
  const cands = candidatas(bboxU(P), 5);
  const D=[], X=[], Y=[], Z=[], R=[];
  for (let d=0; d<L+1e-6; d+=paso){ D.push(d); } if (L-D[D.length-1]>1e-3) D.push(L);
  for (const d of D){ const p=interp(P,C,d); X.push(p[0]); Y.push(p[1]); const z=zAt(p[0],p[1]); Z.push(z==null?NaN:z); const f=parcelaEn(p[0],p[1],cands); R.push(f?f.__k:null); }
  if (Z.every(z=>isNaN(z))) throw new Error('La línea queda fuera del modelo del terreno (término municipal).');
  const keyAt = d => { const p=interp(P,C,Math.max(0,Math.min(L,d))); const f=parcelaEn(p[0],p[1],cands); return f?f.__k:null; };
  const zl = d => { const p=interp(P,C,d); return zAt(p[0],p[1]); };
  // cortes con los lindes (planos verticales de las propiedades)
  const bb=bboxU(P); let ds=[];
  for (const f of cands){ const b=f.__ub; if (b[2]<bb[0]||b[0]>bb[2]||b[3]<bb[1]||b[1]>bb[3]) continue; ds = ds.concat(cortesConPolys(P,C,f.__u)); }
  ds.sort((a,b)=>a-b); const cortes=[];
  for (const d of ds){ if (cortes.length && d-cortes[cortes.length-1].d<0.10) continue; const ant=keyAt(d-0.25), post=keyAt(d+0.25); if (ant===post) continue;
    const p=interp(P,C,d); cortes.push({d, x:p[0], y:p[1], ant, post, zt:zAt(p[0],p[1])}); }
  const distintas=[...new Set(R.filter(Boolean))];
  // parcelas principales: se descartan las que la línea solo roza en sus extremos (p. ej. el margen tras el linde exterior)
  const tramo={}; R.forEach(k=>{ if (k) tramo[k]=(tramo[k]||0)+paso; });
  let princ=distintas.filter(k=>tramo[k]>=Math.max(5,0.08*L)); if (princ.length<2) princ=distintas;
  let tipo = o.tipo;
  if (o.refA && o.refB) tipo='seccion';
  if (tipo==='auto') tipo = (princ.length>=2 && L<=400) ? 'seccion' : 'perfil';
  let aviso='';
  if (tipo==='seccion' && distintas.length<2 && !(o.refA&&o.refB)){ tipo='perfil'; aviso='La línea no atraviesa dos parcelas: se calcula como perfil longitudinal. Alárgala para que cruce las dos parcelas.'; }
  const res = {nombre:o.nombre, tipo, L, paso, P, C, D, X, Y, Z, R, cortes, aviso, metodo:o.metodo, rv:{}, fecha:hoy()};
  // estadísticas generales
  const zv=Z.filter(z=>!isNaN(z)); res.zmin=Math.min(...zv); res.zmax=Math.max(...zv);

    RES = calcularPerfil(lin.P, {nombre:$('#p-nom').value.trim()||('S-'+nSec), paso:$('#p-paso').value, tipo:$('#p-tipo').value, metodo:$('#p-met').value, refA:lin.refA, refB:lin.refB});
    if (RES.nombre===('S-'+nSec)) nSec++;
    st.textContent=RES.aviso||''; mostrarResultadoPerfil(RES); pintarPerfilMapa(RES); $('#graf').hidden=false; map.invalidateSize(); pintarGrafico();
  } catch(e){ console.error(e); st.textContent=e.message; } }, 20); }
function pintarPerfilMapa(res){ capaRes.clearLayers();
  for (const [k,col] of [[res.A,'#1d4ed8'],[res.B,'#c2410c']]){ const f=k&&fParc(k); if (f) L.geoJSON(f,{interactive:false,style:{color:col,weight:2.5,fillOpacity:.22}}).addTo(capaRes); }
  const ll=res.P.map(p=>aLL(p[0],p[1])); L.polyline(ll,{color:'#fff',weight:6,opacity:.9,interactive:false}).addTo(capaRes); L.polyline(ll,{color:'#dc2626',weight:3,interactive:false}).addTo(capaRes);
  res.cortes.forEach(c=>L.circleMarker(aLL(c.x,c.y),{radius:4,color:'#fff',weight:1.5,fillColor:'#111',fillOpacity:1}).bindTooltip(c.rol+' · d '+nf(c.d)+' m · TN '+nf(c.zt)+(c.rvz!=null?' · RV '+nf(c.rvz):'')).addTo(capaRes));
  L.marker(ll[0],{icon:L.divIcon({className:'',html:'<b style="background:#fff;padding:1px 4px;border-radius:3px;border:1px solid #dc2626">0</b>'})}).addTo(capaRes);
  const bl=L.latLngBounds(ll), pa=map.latLngToContainerPoint(bl.getSouthWest()), pb=map.latLngToContainerPoint(bl.getNorthEast());
  if (!map.getBounds().contains(bl) || pa.distanceTo(pb)<90) map.fitBounds(bl.pad(0.6),{maxZoom:19}); }
function mostrarResultadoPerfil(res){ const sec=res.tipo==='seccion'; let h='';
  h += `<h3>${sec?'Sección entre parcelas':'Perfil longitudinal'} · ${esc(res.nombre)}</h3>`;
  if (sec){ h += `<p class="nota"><b style="color:#1d4ed8">A</b> ${esc(etiqParc(res.A))}<br><b style="color:#c2410c">B</b> ${esc(etiqParc(res.B))}</p>`;
    h += `<div class="kpis"><div class="kpi"><b>${sg(res.zBe-res.zAe)} m</b><span>Desnivel entre lindes exteriores</span></div><div class="kpi"><b>${nf(res.pend[res.metodo])} %</b><span>Pendiente de la rasante principal</span></div>
      <div class="kpi"><b>${nf(res.dBe-res.dAe)} m</b><span>Distancia entre lindes exteriores</span></div><div class="kpi"><b>${res.zmA!=null?sg(res.zmB-res.zmA)+' m':'—'}</b><span>Desnivel entre cotas medias</span></div></div>`;
    h += `<table><tr><th>Rasante</th><th>Pendiente</th></tr>${['extremos','medias','ajuste'].filter(k=>res.rv[k]).map(k=>`<tr><td${k===res.metodo?' style="font-weight:700"':''}>${NOM_RV[k]}</td><td>${nf(res.pend[k])} %</td></tr>`).join('')}
      ${res.plano?`<tr><td>Plano 3D ajustado a A+B</td><td>${nf(res.plano.pend)} % hacia ${nf(res.plano.azi,0)}° ${ROSA(res.plano.azi)} · RMSE ${nf(res.plano.rmse)} m</td></tr>`:''}</table>`; }
  else h += `<div class="kpis"><div class="kpi"><b>${nf(res.L)} m</b><span>Longitud planimétrica (${nf(res.L3)} m sobre el terreno)</span></div><div class="kpi"><b>${sg(res.z1-res.z0)} m</b><span>Desnivel inicio–fin (${nf(res.z0)} → ${nf(res.z1)})</span></div>
      <div class="kpi"><b>${sg(res.pend.extremos)} %</b><span>Pendiente media</span></div><div class="kpi"><b>${nf(res.pmax)} %</b><span>Pendiente máxima (tramo de ${nf(res.wpmax,0)} m)</span></div>
      <div class="kpi"><b>${nf(res.subida,1)} / ${nf(res.bajada,1)} m</b><span>Subida / bajada acumuladas</span></div><div class="kpi"><b>${nf(res.zmin)} – ${nf(res.zmax)}</b><span>Cota mínima – máxima (m)</span></div></div>`;

  h += `<div class="btns" style="margin-top:12px"><button class="b pri" id="p-pdf">Descargar PDF</button><button class="b" id="p-csv">Descargar CSV</button><button class="b" id="p-ver">Ver gráfico</button></div>`;
  $('#p-res').innerHTML=h; $('#p-pdf').onclick=()=>pdfPerfil(res); $('#p-csv').onclick=()=>guardar(csvPerfil(res),(sec?'seccion_':'perfil_')+limpio(res.nombre)+'.csv',$('#p-est'));
  $('#p-ver').onclick=()=>{ $('#graf').hidden=false; map.invalidateSize(); pintarGrafico(); }; }
// gráfico en pantalla
const gcv=$('#gcanvas'); let marcaHover=null;
function pintarGrafico(){ if (!RES || $('#graf').hidden) return; const dpr=window.devicePixelRatio||1; gcv.width=Math.max(300,gcv.clientWidth*dpr); gcv.height=Math.max(120,gcv.clientHeight*dpr);
  const E=dibujarGrafico(gcv,RES,{exag:$('#p-exag')?$('#p-exag').value:'auto', s:dpr}); $('#g-tit').textContent=(RES.tipo==='seccion'?'Sección ':'Perfil ')+RES.nombre+' · E.V. ×'+nf(E,1); }
new ResizeObserver(()=>pintarGrafico()).observe(gcv);
gcv.addEventListener('mousemove', e=>{ if (!RES||!RES.__tf) return; const dpr=window.devicePixelRatio||1, t=RES.__tf; const d=(e.offsetX*dpr-t.ml)/t.pw*t.L; if (d<0||d>t.L) return;
  const p=interp(RES.P,RES.C,d), z=zAt(p[0],p[1]); const f=parcelaEn(p[0],p[1],candidatas([p[0],p[1],p[0],p[1]],1)); const rv=RES.rv[RES.metodo];

// ================================================================ modo DISTANCIA
let MED=null;
function panelDistancia(){ $('#panel').innerHTML = `<h2>Distancia</h2><p class="sub">Mide una línea quebrada de dos o más puntos: longitud planimétrica y sobre el terreno, tramos y pendientes.</p>
  <div class="btns"><button class="b pri" id="d-dib">Medir</button><button class="b" id="b-fin" disabled>Terminar</button><button class="b" id="d-borrar">Borrar</button></div><p class="estado" id="d-est"></p><div id="d-res"></div>${DET_PIE}`;

  $('#b-fin').onclick=terminar; $('#d-borrar').onclick=()=>{ cancelarDibujo(); capaRes.clearLayers(); MED=null; $('#d-res').innerHTML=''; estado(''); };
  if (MED&&MED.tipo==='linea') resultadoDistancia(); }
function longTerreno(P){ let l=0, zp=null; const C=acumulada(P), Lt=C[C.length-1], s=Math.max(1,Lt/3000); for (let d=0; d<=Lt+1e-6; d+=s){ const p=interp(P,C,Math.min(d,Lt)); const z=zAt(p[0],p[1]); if (zp!=null&&z!=null) l+=Math.hypot(s,z-zp); else l+=d?s:0; zp=z; } return l; }
function resultadoDistancia(){ const P=MED.P, C=acumulada(P), Lt=C[C.length-1]; const z=P.map(p=>zAt(p[0],p[1])); MED.L=Lt; MED.L3=longTerreno(P);
  capaRes.clearLayers(); const ll=P.map(p=>aLL(p[0],p[1])); L.polyline(ll,{color:'#fff',weight:6,interactive:false}).addTo(capaRes); L.polyline(ll,{color:'#dc2626',weight:3,interactive:false}).addTo(capaRes);
  ll.forEach((q,i)=>L.circleMarker(q,{radius:4,color:'#dc2626',fillColor:'#fff',fillOpacity:1,weight:2}).bindTooltip('V'+(i+1)+' · '+nf(C[i],2)+' m').addTo(capaRes));
  MED.tramos=P.slice(1).map((p,i)=>{ const l=C[i+1]-C[i], dz=(z[i+1]!=null&&z[i]!=null)?z[i+1]-z[i]:null; return {i:i+1,l,acu:C[i+1],dz,pend:dz!=null&&l?dz/l*100:null,rumbo:rumbo(p[0]-P[i][0],p[1]-P[i][1])}; });
  let h=`<div class="kpis"><div class="kpi"><b>${nf(Lt)} m</b><span>Longitud planimétrica (UTM)</span></div><div class="kpi"><b>${nf(MED.L3)} m</b><span>Longitud sobre el terreno</span></div>
    <div class="kpi"><b>${sg(z[z.length-1]!=null&&z[0]!=null?z[z.length-1]-z[0]:null)} m</b><span>Desnivel inicio–fin</span></div><div class="kpi"><b>${P.length-1}</b><span>Tramos</span></div></div>
    <h3>Tramos</h3><div class="tabla-scroll"><table><tr><th>Tramo</th><th>Longitud</th><th>Acumulada</th><th>Rumbo</th><th>Desnivel</th><th>Pend.</th></tr>`+
    MED.tramos.map(t=>`<tr><td>V${t.i}–V${t.i+1}</td><td>${nf(t.l)}</td><td>${nf(t.acu)}</td><td>${nf(t.rumbo,0)}° ${ROSA(t.rumbo)}</td><td>${sg(t.dz)}</td><td>${sg(t.pend,1)} %</td></tr>`).join('')+`</table></div>
    <div class="btns" style="margin-top:12px"><button class="b pri" id="d-pdf">Descargar PDF</button><button class="b" id="d-csv">CSV de vértices</button><button class="b" id="d-perfil">Ver su perfil</button></div>`;
  $('#d-res').innerHTML=h; $('#d-pdf').onclick=()=>pdfMedicion(MED,$('#d-est')); $('#d-csv').onclick=()=>guardar(csvVertices(MED.P),'distancia_vertices.csv',$('#d-est'));
  $('#d-perfil').onclick=()=>{ const P=MED.P; document.querySelector('.modo[data-m="perfil"]').click(); $('#p-tipo').value='perfil'; ultimaLinea={P}; ejecutarPerfil(ultimaLinea); }; }
function csvVertices(P){ const L=['vertice;x_utm;y_utm;longitud;latitud;z_terreno']; P.forEach((p,i)=>{ const ll=aLL(p[0],p[1]), z=zAt(p[0],p[1]); L.push(['V'+(i+1),p[0].toFixed(2),p[1].toFixed(2),ll.lng.toFixed(7),ll.lat.toFixed(7),z==null?'':z.toFixed(2)].map(v=>v.replace('.',',')).join(';')); });
  return new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}); }

// ================================================================ modo ÁREA
function panelArea(){ $('#panel').innerHTML = `<h2>Área</h2><p class="sub">Dibuja un recinto: superficie, perímetro, cotas y pendiente media del terreno, y coordenadas de los vértices.</p>
  <div class="btns"><button class="b pri" id="a-dib">Medir</button><button class="b" id="b-fin" disabled>Terminar</button><button class="b" id="a-borrar">Borrar</button></div><p class="estado" id="a-est"></p><div id="a-res"></div>${DET_PIE}`;

  $('#b-fin').onclick=terminar; $('#a-borrar').onclick=()=>{ cancelarDibujo(); capaRes.clearLayers(); MED=null; $('#a-res').innerHTML=''; estado(''); };
  if (MED&&MED.tipo==='area') resultadoArea(); }
function resultadoArea(){ const P=MED.P, ring=P.concat([P[0]]); MED.A=areaAnillo(ring); MED.per=acumulada(ring).pop();
  const m=muestreo([[ring]],30000); MED.zs=m.Z.length?{min:Math.min(...m.Z),max:Math.max(...m.Z),med:m.Z.reduce((a,b)=>a+b,0)/m.Z.length}:null; MED.plano=planoLSQ(m.X,m.Y,m.Z);
  const cands=candidatas(bboxU(P),1); const parcs=new Set(); m.X.forEach((x,i)=>{ if (i%3) return; const f=parcelaEn(x,m.Y[i],cands); if (f) parcs.add(f.__k); }); MED.parcs=[...parcs];
  let auto=false; for (let i=0;i<P.length-1&&!auto;i++) for (let j=i+2;j<P.length;j++){ if (i===0&&j===P.length-1) continue; if (cruce(P[i],P[i+1],P[j],P[(j+1)%P.length])!=null){ auto=true; break; } }
  capaRes.clearLayers(); const ll=P.map(p=>aLL(p[0],p[1])); L.polygon(ll,{color:'#dc2626',weight:3,fillOpacity:.15,interactive:false}).addTo(capaRes);
  ll.forEach((q,i)=>L.circleMarker(q,{radius:4,color:'#dc2626',fillColor:'#fff',fillOpacity:1,weight:2}).bindTooltip('V'+(i+1)).addTo(capaRes));
  let h=`${auto?'<p class="estado" style="color:#c0392b">El recinto se corta a sí mismo: la superficie no es fiable. Redibújalo.</p>':''}
    <div class="kpis"><div class="kpi"><b>${nf(MED.A)} m²</b><span>Superficie (${nf(MED.A/10000,4)} ha)</span></div><div class="kpi"><b>${nf(MED.per)} m</b><span>Perímetro</span></div>
    <div class="kpi"><b>${MED.zs?nf(MED.zs.min)+' – '+nf(MED.zs.max):'—'}</b><span>Cota mínima – máxima (m) · media ${MED.zs?nf(MED.zs.med):'—'}</span></div>
    <div class="kpi"><b>${MED.plano?nf(MED.plano.pend,1)+' %':'—'}</b><span>Pendiente media ${MED.plano?'hacia '+ROSA(MED.plano.azi)+' ('+nf(MED.plano.azi,0)+'°)':''}</span></div></div>
    <p class="nota">Parcelas del parcelario dentro del recinto: ${MED.parcs.length}${MED.parcs.length&&MED.parcs.length<=6?' — '+MED.parcs.map(k=>esc(etiqParc(k))).join('; '):''}</p>
    <h3>Vértices (ETRS89 UTM 30N)</h3><div class="tabla-scroll"><table><tr><th>Vértice</th><th>X</th><th>Y</th><th>Cota</th><th>Lado</th></tr>`+
    P.map((p,i)=>{ const q=ring[i+1]; return `<tr><td>V${i+1}</td><td>${nf(p[0])}</td><td>${nf(p[1])}</td><td>${nf(zAt(p[0],p[1]))}</td><td>${nf(Math.hypot(q[0]-p[0],q[1]-p[1]))}</td></tr>`; }).join('')+`</table></div>
    <div class="btns" style="margin-top:12px"><button class="b pri" id="a-pdf">Descargar PDF</button><button class="b" id="a-csv">CSV de vértices</button></div>`;
  $('#a-res').innerHTML=h; $('#a-pdf').onclick=()=>pdfMedicion(MED,$('#a-est')); $('#a-csv').onclick=()=>guardar(csvVertices(MED.P),'area_vertices.csv',$('#a-est')); }

async function pdfMedicion(M, st){ st.textContent='Generando el PDF…';

    cabecera(doc, lin?'MEDICIÓN DE DISTANCIA':'MEDICIÓN DE SUPERFICIE', lin? 'Longitud '+nf(M.L)+' m · '+(M.P.length-1)+' tramo(s)' : 'Superficie '+nf(M.A)+' m² ('+nf(M.A/10000,4)+' ha) · perímetro '+nf(M.per)+' m');
    const pl=await planoSituacion(lin?{linea:M.P}:{poligono:M.P},178,170,{orto:true}); doc.addImage(pl.url,'JPEG',8,23.5,178,170); doc.setDrawColor(90); doc.setLineWidth(0.3); doc.rect(8,23.5,178,170);
    const c=bboxU(M.P); doc.addImage(situacionTermino((c[0]+c[2])/2,(c[1]+c[3])/2,26),'PNG',159,24.5,26,26); doc.setDrawColor(150); doc.rect(159,24.5,26,26);
    let y;
    if (lin){ const z0=zAt(...M.P[0]), z1=zAt(...M.P[M.P.length-1]);
      y=bloque(doc,192,26,97,'RESULTADOS',[['Longitud planimétrica',nf(M.L)+' m',true],['Longitud sobre el terreno',nf(M.L3)+' m'],['Cota inicio / fin',nf(z0)+' / '+nf(z1)+' m'],['Desnivel inicio-fin',sg(z1!=null&&z0!=null?z1-z0:null)+' m'],['Pendiente media',sg(z1!=null&&z0!=null?(z1-z0)/M.L*100:null)+' %']],40);
      y=tablaPDF(doc,192,y+4,97,'TRAMOS',['Tramo','Rumbo','Long. (m)','Acum. (m)','Pend.'],M.tramos.map(t=>['V'+t.i+'-V'+(t.i+1),nf(t.rumbo,0)+'° '+ROSA(t.rumbo),nf(t.l),nf(t.acu),sg(t.pend,1)+' %']),[17,22,20,20,18],14); }
    else { y=bloque(doc,192,26,97,'RESULTADOS',[['Superficie',nf(M.A)+' m² ('+nf(M.A/10000,4)+' ha)',true],['Perímetro',nf(M.per)+' m'],['Cota mín. / máx. / media',M.zs?nf(M.zs.min)+' / '+nf(M.zs.max)+' / '+nf(M.zs.med)+' m':'—'],
        ['Pendiente media (plano)',M.plano?nf(M.plano.pend,1)+' % hacia '+ROSA(M.plano.azi)+' ('+nf(M.plano.azi,0)+'°)':'—'],['Parcelas en el recinto',String(M.parcs.length)]],40); }
    const ring=M.P.concat([M.P[0]]);
    tablaPDF(doc,192,y+4,97,'VÉRTICES · ETRS89 UTM 30N',['Vért.','X','Y','Cota'],M.P.map((p,i)=>['V'+(i+1),nf(p[0]),nf(p[1]),nf(zAt(p[0],p[1]))]),[12,32,32,21],Math.max(4,Math.floor((186-y)/3.6)-3),0);
    doc.setFontSize(5.8); doc.setTextColor(60); doc.text('Plano'+(pl.orto?' sobre ortofoto PNOA':'')+' con el parcelario municipal',9,191.8);
    pie(doc, FUENTES+'Las cotas del terreno son orientativas (MDT05). Medición gráfica sin valor de levantamiento topográfico.');
    await guardar(doc.output('blob'), (lin?'medicion_distancia_':'medicion_area_')+new Date().toISOString().slice(0,10)+'.pdf', st);
  } catch(e){ console.error(e); st.textContent='No se pudo generar el PDF: '+e.message; } }

// ================================================================ modo PUNTO
function panelPunto(){ $('#panel').innerHTML = `<h2>Coordenadas y cota de un punto</h2><p class="sub">Haz clic en el mapa para obtener sus coordenadas UTM y geográficas, la cota del terreno y la parcela.</p><p class="estado" id="u-est"></p><div id="u-res"></div>${DET_PIE}`;

function calcPunto(ll){ const [x,y]=aU(ll), z=zAt(x,y); const f=parcelaEn(x,y,candidatas([x,y,x,y],2)); const p=f?f.properties:{};

// ================================================================ modo RUTA
function panelRuta(){ $('#panel').innerHTML = `<h2>Distancia entre dos puntos y ruta</h2><p class="sub">Marca origen y destino. Se calcula la distancia en línea recta, el desnivel y el rumbo; la ruta por calles, carril bici o transporte público se abre en Google Maps.</p>
  <div class="btns"><button class="b pri" id="r-dib">Marcar origen y destino</button><button class="b" id="r-borrar">Borrar</button></div><p class="estado" id="r-est"></p><div id="r-res"></div>${DET_PIE}`;

  $('#r-borrar').onclick=()=>{ cancelarDibujo(); capaRes.clearLayers(); $('#r-res').innerHTML=''; estado(''); }; }
function resultadoRuta(pts){ const P=pts.map(aU), [a,b]=P, d=Math.hypot(b[0]-a[0],b[1]-a[1]), za=zAt(...a), zb=zAt(...b), rb=rumbo(b[0]-a[0],b[1]-a[1]);
  capaRes.clearLayers(); L.polyline(pts,{color:'#dc2626',weight:3,dashArray:'8 6',interactive:false}).addTo(capaRes);
  pts.forEach((q,i)=>L.marker(q,{icon:L.divIcon({className:'',html:'<b style="background:'+(i?'#c2410c':'#1d4ed8')+';color:#fff;padding:2px 6px;border-radius:4px">'+(i?'Destino':'Origen')+'</b>',iconAnchor:[-6,10]})}).addTo(capaRes));
  const o=pts[0].lat.toFixed(6)+','+pts[0].lng.toFixed(6), t=pts[1].lat.toFixed(6)+','+pts[1].lng.toFixed(6);
  const gm=m=>`https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${t}&travelmode=${m}`;
  $('#r-res').innerHTML=`<div class="kpis"><div class="kpi"><b>${nf(d)} m</b><span>Distancia en línea recta (${nf(d/1000,3)} km)</span></div><div class="kpi"><b>${sg(za!=null&&zb!=null?zb-za:null)} m</b><span>Desnivel origen → destino</span></div>
    <div class="kpi"><b>${nf(rb,0)}° ${ROSA(rb)}</b><span>Rumbo (desde el norte)</span></div><div class="kpi"><b>${nf(za,1)} → ${nf(zb,1)}</b><span>Cotas del terreno (m)</span></div></div>
    <h3>Ruta en Google Maps</h3><div class="btns"><a class="b" target="_blank" rel="noopener" href="${gm('driving')}">Coche</a><a class="b" target="_blank" rel="noopener" href="${gm('walking')}">A pie</a><a class="b" target="_blank" rel="noopener" href="${gm('bicycling')}">Bicicleta</a><a class="b" target="_blank" rel="noopener" href="${gm('transit')}">Transporte público</a></div>
    <p class="nota">El cálculo de rutas por la red viaria lo hace Google Maps; aquí no se guarda ni se envía nada más que las coordenadas al pulsar el enlace.</p>
    <div class="btns"><button class="b" id="r-perfil">Perfil del tramo recto</button></div>`;
  $('#r-perfil').onclick=()=>{ document.querySelector('.modo[data-m="perfil"]').click(); $('#p-tipo').value='perfil'; ultimaLinea={P}; ejecutarPerfil(ultimaLinea); }; }

// ================================================================ arranque
panelPerfil();
Promise.all([cargarMDT(), cargarParcelas(), cargarTermino()]).then(([m,p,t])=>{ MDT=m; PARC=p; TERM=t;
  if (TERM){ TERMU=[]; for (const f of TERM.features){ const g=f.geometry; const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates; for (const pl of polys) TERMU.push(pl.map(r=>r.map(c=>proj4('EPSG:4326',UTM,c)))); }
    const lt=L.geoJSON(TERM,{interactive:false,style:{color:'#ffd400',weight:2,fill:false}}).addTo(map); map.fitBounds(lt.getBounds()); }
  verParcelas(); $('#cargando').hidden=true;
  if (!MDT) estado('Aviso: no se ha cargado el modelo del terreno (data/mdt.js); las cotas no estarán disponibles.');
}).catch(e=>{ console.error(e); $('#cargando').textContent='No se pudieron cargar los datos: '+e.message; });
})();
</script>
